name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml

  pack:
    name: Build npm package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Pack and verify a clean install
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$version" >&2
            exit 1
          fi
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/premind-$version.tgz" "$RUNNER_TEMP/premind.tgz"
          npm install --prefix "$RUNNER_TEMP/premind-smoke" --no-audit --no-fund "$RUNNER_TEMP/premind.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premind-npm-package
          path: ${{ runner.temp }}/premind.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm package
    if: github.event_name == 'release'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: premind-npm-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.3
      - run: npm publish ./premind.tgz --provenance --access public
