name: OpenCode V2 end-to-end

# Runs the OpenCode V2 plugin in a real `opencode serve` against a fake model
# and a fake GitHub. Pull requests use the pinned OpenCode version; the nightly
# run also tries the latest release so upstream changes show up early.

on:
  push:
    branches: [main]
  # No branch filter, so PRs stacked on other PRs run it too.
  pull_request:
    paths:
      - "src/plugin-opencode*/**"
      - "src/daemon/**"
      - "src/shared/**"
      - "src/client/**"
      - "src/test/opencode-v2/**"
      - "src/test/harness/fake-github.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/opencode-v2-e2e.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

env:
  # Keep in step with @opencode/plugin and @opencode/client in package.json.
  OPENCODE_PINNED: "2.4.2"

jobs:
  e2e:
    name: OpenCode ${{ matrix.opencode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: ${{ github.event_name == 'pull_request' && fromJSON('["pinned"]') || fromJSON('["pinned", "latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13"
      - run: bun install --frozen-lockfile
      - run: bun run build:runtime
      - name: Install OpenCode
        run: |
          version="${{ matrix.opencode == 'pinned' && env.OPENCODE_PINNED || 'latest' }}"
          npm install --global "@opencode/cli@${version}"
          opencode --version
      - run: bun run test:opencode-v2
        env:
          PREMIND_REQUIRE_OPENCODE: "1"
